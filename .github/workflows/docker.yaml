name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Skopeo Sync
    runs-on: ubuntu-24.04
    steps:
      - name: Pre clean root partition
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt clean
          df -hT

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version

      - name: Sync images to Aliyun Registry
        run: |
          export REGISTRY_AUTH_FILE=$(mktemp)
          skopeo login --authfile "$REGISTRY_AUTH_FILE" -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ALIYUN_REGISTRY}"

          # 预处理：检测重名镜像
          declare -A duplicate_images
          declare -A temp_map
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            if [[ -n "${temp_map[$image_name]}" ]]; then
              if [[ "${temp_map[$image_name]}" != "${name_space}"  ]]; then
                echo "==> duplicate image name: ${image_name}"
                duplicate_images["${image_name}"]="true"
              fi
            else
              temp_map["${image_name}"]="${name_space}"
            fi
          done < images.txt

          ALL_OK=true
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            platform_prefix=""
            override_opt=""
            if [ -n "${platform}" ]; then
              platform_prefix="${platform//\//_}_"
              arch=$(echo "${platform}" | cut -d'/' -f2)
              os=$(echo "${platform}" | cut -d'/' -f1)
              override_opt="--override-os ${os} --override-arch ${arch}"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            src_image="docker://${image%%@*}"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
              if [[ -n "${name_space}" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            dest_image="docker://${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "=================================================="
            echo "Sync: ${src_image}  =>  ${dest_image}"
            echo "CMD: skopeo ${override_opt} copy ${src_image} ${dest_image} --authfile ${REGISTRY_AUTH_FILE}"
            echo "=================================================="

            if skopeo ${override_opt} copy "${src_image}" "${dest_image}" --authfile "${REGISTRY_AUTH_FILE}"; then
              echo "✅ SUCCESS"
            else
              echo "❌ FAILED: ${src_image}"
              ALL_OK=false
            fi
            df -hT
          done < images.txt

          if [ "$ALL_OK" = false ]; then
            echo "⚠️ Some images sync failed! Check log above."
          fi
          exit 0
